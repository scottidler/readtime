[package]
name = "readtime"
version = "0.1.0"
edition = "2024"
authors = ["Scott Idler"]
build = "build.rs"
description = "A CLI application generated by rust-scaffold"

[dependencies]
clap = { version = "4.5.52", features = ["derive"] }
colored = "3.0.0"
dirs = "6.0.0"
env_logger = "0.11.8"
eyre = "0.6.12"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
walkdir = "2"
unicode-width = "0.2"

[build-dependencies]
# For build.rs if needed

[dev-dependencies]
tempfile = "3"
